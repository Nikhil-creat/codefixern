<!DOCTYPE html>
<html lang="en">
<head>

<title>404 — CodeFixern</title>

<style>

  p{color:#8b95a5;font-size:14px;line-height:1.6;margin:0 0 20px;}
  a{display:inline-block;color:#0e1116;background:#e8a33d;text-decoration:none;font-weight:600;
    padding:9px 16px;border-radius:3px;font-size:13px;}
</style>

<body>
  <div class="wrap">
    <div class="code">EXIT CODE: 404</div>
    <h1>Nothing diagnosed here.</h1>

    <a href="/">Return to CodeFixern</a>

</html>
